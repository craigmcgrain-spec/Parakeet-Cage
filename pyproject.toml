[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-cage"
version = "1.0.0"
description = "Push-to-talk dictation for Linux with fully local inference, powered by Moondream Parakeet Redux"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Craig McGrain" }]
keywords = ["dictation", "speech-to-text", "asr", "parakeet", "wayland", "linux", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment :: Gnome",
]

# GTK/PyGObject and dbus-python are compiled against the system interpreter, so on
# Fedora/RHEL install them with dnf (python3-gobject, dbus-python) - see README.md.
dependencies = [
    "kestrel>=0.9",        # Parakeet Redux (Photon) inference runtime
    "torch>=2.0",          # required by kestrel; imported for tensor dtypes
    "numpy>=1.24",         # resampling and buffering
    "sounddevice>=0.5",    # microphone capture
    "python-xlib>=0.33",   # global hotkey grabs
    "pystray>=0.19",       # tray icon
    "pillow>=10.0",        # tray icon rendering
    "pynput>=1.7",         # X11-only keystroke fallback
    "PyGObject>=3.42",     # settings dialog, tray main loop
    "dbus-python>=1.3",    # Klipper clipboard, portal virtual keyboard
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
parakeet-cage = "parakeet_cage.app:main"

[project.urls]
Homepage = "https://github.com/craigmcgrain-spec/Parakeet-Cage"
Repository = "https://github.com/craigmcgrain-spec/Parakeet-Cage"
Issues = "https://github.com/craigmcgrain-spec/Parakeet-Cage/issues"
"Model (Parakeet Redux)" = "https://huggingface.co/moondream/parakeet-redux"

[tool.setuptools]
packages = ["parakeet_cage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
